<title>Elia Cappelli — Osteopata a Rimini</title>
<style>
:root{--bg:#eef3f9;--card:#fff;--text:#1b3a6b;--muted:#5d6f8a;--navy:#1b3a6b;--blue:#2f6fb0;--gold:#c9a24f;--btn-text:#fff;--line:#e0e7f1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1424;--card:#121f36;--text:#e8eefa;--muted:#9fb0cc;--navy:#5b9bd5;--blue:#3b82c8;--gold:#d9b56a;--btn-text:#08101e;--line:#22314d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1424;--card:#121f36;--text:#e8eefa;--muted:#9fb0cc;--navy:#5b9bd5;--blue:#3b82c8;--gold:#d9b56a;--btn-text:#08101e;--line:#22314d;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 10px 30px rgba(27,58,107,.12)}
.logo{background:#fff;padding:20px 20px 8px;text-align:center;border-bottom:3px solid var(--gold)}
.logo img{width:72%;max-width:280px;height:auto;display:block;margin:0 auto}
.body{padding:24px 22px 28px;text-align:center}
h1{font-size:21px;line-height:1.25;margin:0 0 6px;color:var(--text)}
.role{color:var(--gold);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:13px;margin:0 0 22px}
.btn{display:block;width:100%;padding:15px;border-radius:14px;text-decoration:none;font:inherit;font-weight:600;margin-bottom:10px;border:2px solid transparent;cursor:pointer}
.b1{background:var(--navy);color:var(--btn-text)}
.b2{background:#1a9f4f;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px}
.b2 svg{width:22px;height:22px;flex:none}
.b3{background:transparent;color:var(--text);border-color:var(--gold)}
.b3 small{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:3px}
.info{text-align:left;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:15px}
.info h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
.info p{margin:0 0 16px;line-height:1.5}
.info a{color:var(--blue)}
.row{display:flex;justify-content:space-between;gap:12px}
</style>
